<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu sản phẩm</title>
</head>
<body>
    <header>
        <svg width="50" height="50" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" fill="#4CAF50" />
            <text x="50" y="55" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">TLU</text>
        </svg>
        <h1>Trải nghiệm iPhone 16 Pro Max</h1>
    </header>

    <main>
        <section class =  "media-section">
            <h2>Hình ảnh sản phẩm</h2>
            <figure>
                <img src="iphone-16-titan-tu-nhien.jpg" 
                     alt="iPhone 16 Pro Max màu Titan Tự nhiên mặt lưng" 
                     loading="lazy" 
                     style="max-width: 100%; height: auto;">
                <figcaption>Màu Titan Tự nhiên sang trọng và bền bỉ.</figcaption>
            </figure>

            <figure>
                <img src="iphone-16-camera.jpg" 
                     alt="Cận cảnh cụm 3 camera sau của iPhone 16 Pro Max" 
                     loading="lazy" 
                     style="max-width: 100%; height: auto;">
                <figcaption>Cụm camera nâng cấp với khả năng zoom quang học 5x.</figcaption>
            </figure>

            <figure>
                <img src="iphone-16-mat-truoc.jpg" 
                     alt="Màn hình viền siêu mỏng của iPhone 16 Pro Max" 
                     loading="lazy" 
                     style="max-width: 100%; height: auto;">
                <figcaption>Màn hình Super Retina XDR với viền mỏng nhất từ trước đến nay.</figcaption>
            </figure>
        </section>

        <section class="media-section">
            <h2>Video Đánh giá từ chuyên gia</h2>
            <iframe width="100%" height="450" 
                    src="https://www.youtube.com/watch?v=_WbyHau2QW4" 
                    title="YouTube video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
            </iframe>
        </section>

        <section class = "media-section">
            <h2>Video Quảng cáo</h2>
            <video controls poster="poster-thumbnail.jpg" style="max-width: 100%; height: auto;">
                <source src="promo-video.mp4" type="video/mp4">
                <source src="promo-video.webm" type="video/webm">
            </video>
        </section>
    </main>

</body>
</html>
