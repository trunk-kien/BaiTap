<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản E-Commerce</title>
</head>
<body>
    <form action="#" method="POST">

        <fieldset>
            <legend>Thông tin cá nhân</legend>

            <label for="fullname">Họ tên:</label>
            <input type="text" id="fullname" name="fullname" required minlength="2" maxlength="50" placeholder="Nhập họ và tên của bạn">
            <br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="example@gmail.com">
            <br>

            <label for="phone">Số điện thoại:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="Nhập 10 chữ số">
            <br>

            <label for="dob">Ngày sinh:</label>
            <input type="date" id="dob" name="dob" max="2026-04-29" placeholder="dd/mm/yyyy">
        </fieldset>

        <fieldset>
            <legend>Tài khoản</legend>

            <label for="username">Tên đăng nhập:</label>
            <input type="text" id="username" name="username" pattern="^[a-zA-Z0-9_]{3,20}$" placeholder="3-20 ký tự (chữ, số, _)">
            <br>

            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" name="password" minlength="8" pattern="(?=.*\d)(?=.*[A-Z]).{8,}" placeholder="Ít nhất 8 ký tự, 1 chữ hoa, 1 số">
            <br>

            <label for="confirm_password">Xác nhận mật khẩu:</label>
            <input type="password" id="confirm_password" name="confirm_password" minlength="8" pattern="(?=.*\d)(?=.*[A-Z]).{8,}" placeholder="Nhập lại mật khẩu">
        </fieldset>

        <fieldset>
            <legend>Thông tin giao hàng</legend>

            <label for="city">Thành phố:</label>
            <select id="city" name="city">
                <option value="" disabled selected>-- Chọn Thành phố --</option>
                <option value="Hanoi">Hà Nội</option>
                <option value="HCMC">Hồ Chí Minh</option>
                <option value="DaNang">Đà Nẵng</option>
                <option value="HaiPhong">Hải Phòng</option>
                <option value="CanTho">Cần Thơ</option>
            </select>
            <br>

            <label for="district">Quận/Huyện:</label>
            <select id="district" name="district">
                <option value="" disabled selected>-- Chọn Quận/Huyện --</option>
                <option value="DongDa">Đống Đa</option>
                <option value="ThanhXuan">Thanh Xuân</option>
                <option value="CauGiay">Cầu Giấy</option>
            </select>
            <br>

            <label for="address">Địa chỉ chi tiết:</label>
            <textarea id="address" name="address" rows="3" placeholder="Số nhà, tên đường, phường/xã..."></textarea>
            <br>

            <label>Giới tính:</label>
            <div class="radio-group">
                <input type="radio" id="gender_male" name="gender" value="Nam">
                <label for="gender_male">Nam</label>

                <input type="radio" id="gender_female" name="gender" value="Nữ">
                <label for="gender_female">Nữ</label>

                <input type="radio" id="gender_other" name="gender" value="Khác">
                <label for="gender_other">Khác</label>
            </div>
        </fieldset>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms" style="width: auto;">Tôi đã đọc và đồng ý với các điều khoản dịch vụ</label>
        <br><br>

        <button type="submit">Đăng ký tài khoản</button>
        <button type="reset">Nhập lại từ đầu</button>

    </form>
</body>
</html>
