<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Trường hợp 1: required</h2>
    <form action="#">
        <input type="text" required value="">
        <button type="submit">Submit</button>
    </form>

    <h2>Trường hợp 2: email</h2>
    <form action="#">
        <input type="email" value="abc">
        <button type="submit">Submit</button>
    </form>

    <h2>Trường hợp 3: min / max</h2>
    <form action="#">
        <input type="number" min="1" max="10" value="15">
        <button type="submit">Submit</button>
    </form>

    <h2>Trường hợp 4: pattern regex</h2>
    <form action="#">
        <input type="text" pattern="[0-9]{10}" value="abc123">
        <button type="submit">Submit</button>
    </form>

    <h2>Trường hợp 5: minlength</h2>
    <form action="#">
        <input type="password" minlength="8" value="123">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
