<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <header class="header">
        <h2>Demo Animations</h2>
        <div class="loading-spinner" title="Đang tải dữ liệu..."></div>
    </header>

    <main class="container">
        <div class="product-grid">
            <div class="card fade-in-element" style="animation-delay: 0.2s;">
                <div class="image-container">
                    <img src="https://placehold.co/300x200?text=ASUS+TUF+Dash+F15" alt="Laptop ASUS TUF">
                </div>
                <div class="card-content">
                    <h3>Laptop ASUS TUF Dash F15</h3>
                    <p class="price">22.500.000đ</p>
                    <button class="btn">Mua ngay</button>
                </div>
            </div>

            <div class="card fade-in-element" style="animation-delay: 0.4s;">
                <div class="image-container">
                    <img src="https://placehold.co/300x200?text=Switch+Bsun+Taichi" alt="Switch Bsun Taichi">
                </div>
                <div class="card-content">
                    <h3>Switch Bsun Taichi (Pack 35)</h3>
                    <p class="price">350.000đ</p>
                    <button class="btn">Mua ngay</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
