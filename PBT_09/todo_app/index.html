<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-app">
        <header>
            <h1>Todo List</h1>
            <form id="todo-form">
                <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
                <button type="submit" id="add-btn">Add</button>
            </form>
        </header>

        <main>
            <ul id="todoList"></ul> 
        </main>

        <footer id="footer">
            <span id="todo-count">0 items left</span>
            <ul class="filters" id="filters">
                <li><a href="#" class="selected" data-filter="all">All</a></li>
                <li><a href="#" data-filter="active">Active</a></li>
                <li><a href="#" data-filter="completed">Completed</a></li>
            </ul>
            <button id="clear-completed">Clear completed</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
