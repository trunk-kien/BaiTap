<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">ShopTLU</div>
        <div class="header-actions">
            <button id="theme-toggle">🌓 Chế độ Tối/Sáng</button>
            <div class="cart-container">
                🛒 Giỏ hàng <span id="cart-badge">0</span>
            </div>
        </div>
    </header>

    <main>
        <div class="toolbar">
            <input type="text" id="search-input" placeholder="Tìm kiếm sản phẩm...">
            
            <div id="filters">
                <button class="filter-btn active" data-category="all">Tất cả</button>
                <button class="filter-btn" data-category="phone">Điện thoại</button>
                <button class="filter-btn" data-category="laptop">Laptop</button>
                <button class="filter-btn" data-category="keyboard">Bàn phím</button>
                <button class="filter-btn" data-category="accessory">Phụ kiện</button>
            </div>

            <select id="sort-select">
                <option value="default">Sắp xếp mặc định</option>
                <option value="price-asc">Giá: Thấp đến Cao</option>
                <option value="price-desc">Giá: Cao đến Thấp</option>
                <option value="name-asc">Tên: A - Z</option>
                <option value="rating-desc">Đánh giá cao nhất</option>
            </select>
        </div>

        <div id="product-list" class="grid-container"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
