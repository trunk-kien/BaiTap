<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Keyboard Navigation</h1>
        <p>Nhấn <kbd>Tab</kbd> để di chuyển. Nhấn <kbd>Ctrl</kbd> + <kbd>K</kbd> để mở Command Palette.</p>
        <button id="open-cmd-btn" aria-label="Mở Command Palette">Mở Command Palette</button>
    </header>

    <main>
        <div id="gallery-grid" class="grid-container" aria-label="Danh sách hình ảnh">
            </div>
    </main>

    <div id="gallery-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Trình xem ảnh toàn màn hình">
        <button id="close-gallery-btn" class="icon-btn close-btn" aria-label="Đóng thư viện ảnh (Escape)">✕</button>
        <div class="modal-content">
            <button id="prev-btn" class="icon-btn nav-btn" aria-label="Ảnh trước (Mũi tên trái)">◀</button>
            <div class="image-wrapper">
                <img id="modal-img" src="" alt="Ảnh phóng to">
                <div id="slideshow-status" aria-live="polite">Trạng thái Slideshow</div>
            </div>
            <button id="next-btn" class="icon-btn nav-btn" aria-label="Ảnh tiếp theo (Mũi tên phải)">▶</button>
        </div>
        <div class="gallery-hints">
            <kbd>←</kbd> <kbd>→</kbd>: Chuyển ảnh | <kbd>1</kbd>-<kbd>9</kbd>: Nhảy đến ảnh | <kbd>Space</kbd>: Play/Pause | <kbd>Esc</kbd>: Đóng
        </div>
    </div>

    <div id="cmd-palette" class="modal hidden" role="dialog" aria-modal="true" aria-label="Command Palette">
        <div class="cmd-content">
            <input type="text" id="cmd-input" aria-label="Tìm kiếm câu lệnh" placeholder="Gõ lệnh (vd: theme, optimize...)">
            <ul id="cmd-list" role="listbox" aria-label="Danh sách kết quả">
                </ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</body>
</html>
