<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý công việc cá nhân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Quản lý công việc cá nhân</h1>
            <button id="btn-open-form" class="btn btn-primary">Thêm công việc</button>
        </header>

        <section class="stats-container">
            <div class="stat-card">
                <span class="stat-label">Tổng số công việc:</span>
                <span id="stat-total" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Đã hoàn thành:</span>
                <span id="stat-completed" class="stat-value completed">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Chưa hoàn thành:</span>
                <span id="stat-pending" class="stat-value pending">0</span>
            </div>
        </section>

        <main class="task-section">
            <div id="task-list" class="task-list">
                </div>
        </main>
    </div>

    <div id="task-modal" class="modal">
        <div class="modal-content">
            <span id="btn-close-form" class="close-btn">&times;</span>
            <h2 id="modal-title">Thêm công việc mới</h2>
            
            <form id="task-form" novalidate> <input type="hidden" id="task-id">

                <div class="form-group">
                    <label for="task-title">Tiêu đề công việc *</label>
                    <input type="text" id="task-title" placeholder="Nhập tiêu đề...">
                    <span id="title-error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="task-desc">Mô tả ngắn</label>
                    <textarea id="task-desc" rows="3" placeholder="Nhập mô tả ngắn..."></textarea>
                    <span id="desc-error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="task-deadline">Hạn hoàn thành *</label>
                    <input type="date" id="task-deadline">
                    <span id="deadline-error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="task-priority">Mức ưu tiên</label>
                    <select id="task-priority">
                        <option value="Thấp">Thấp</option>
                        <option value="Trung bình" selected>Trung bình</option>
                        <option value="Cao">Cao</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-submit-form" class="btn btn-success">Lưu công việc</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-notification" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
