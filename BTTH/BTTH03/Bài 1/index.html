<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hệ Thống Quản Lý Sinh Viên</h1>
        
        <div class="top-bar">
            <button id="btnOpenAddForm" class="btn btn-primary">Thêm sinh viên</button>
            
            <div class="stats">
                <span>Tổng số sinh viên: <strong id="totalStudents">0</strong></span> | 
                <span>Điểm trung bình lớp: <strong id="averageGpa">0.0</strong></span>
            </div>
        </div>

        <div id="notification" class="notification hidden"></div>

        <table>
            <thead>
                <tr>
                    <th>Mã SV</th>
                    <th>Họ và tên</th>
                    <th>Ngày sinh</th>
                    <th>Lớp học</th>
                    <th>Điểm TB</th>
                    <th>Email</th>
                    <th>Thao tác</th>
                </tr>
            </thead>

            <tbody id="studentTableBody">
                
            </tbody>
        </table>
    </div>

    <div id="studentModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Thêm sinh viên</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label>Mã sinh viên *</label>
                    <input type="text" id="studentId">
                </div>
                <div class="form-group">
                    <label>Họ và tên *</label>
                    <input type="text" id="studentName">
                </div>
                <div class="form-group">
                    <label>Ngày sinh *</label>
                    <input type="date" id="studentDob" >
                </div>
                <div class="form-group">
                    <label>Lớp học *</label>
                    <input type="text" id="studentClass">
                </div>
                <div class="form-group">
                    <label>Điểm trung bình *</label>
                    <input type="number" step="0.1" min="0" max="10" id="studentGpa">
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="studentEmail">
                </div>
                <div class="form-actions">
                    <button type="submit" id="btnSubmitForm" class="btn btn-success">Lưu</button>
                    <button type="button" id="btnCloseForm" class="btn btn-secondary">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
