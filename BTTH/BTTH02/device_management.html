<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Thiết bị Máy tính</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .header-bg { background-color: #f8f9fa; border-bottom: 1px solid #e9ecef; }
    </style>
</head>
<body class="bg-light">

    <div class="header-bg py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h2 class="m-0 fw-light">Quản lý Thiết bị Máy tính</h2>
            <div>
                <button class="btn btn-dark btn-sm me-1">Tiếng Việt</button>
                <button class="btn btn-outline-dark btn-sm">English</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="d-flex justify-content-between mb-4">
            <button class="btn btn-outline-dark px-4 py-2 fw-semibold" data-bs-toggle="modal" data-bs-target="#addDeviceModal">Thêm Thiết bị</button>
            <input type="text" class="form-control w-25 border-dark" placeholder="Tìm kiếm thiết bị...">
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Dell OptiPlex 7090</h5>
                        <p class="card-text mb-1"><strong>SN:</strong> DL7090001</p>
                        <p class="card-text mb-1 fw-bold">Máy bàn</p>
                        <p class="card-text mb-3 fw-bold">Hoạt động</p>
                        <button class="btn btn-outline-secondary btn-sm">Sửa</button>
                        <button class="btn btn-outline-secondary btn-sm">Xóa</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">HP LaserJet Pro M404</h5>
                        <p class="card-text mb-1"><strong>SN:</strong> HP404001</p>
                        <p class="card-text mb-1 fw-bold">Máy in</p>
                        <p class="card-text mb-3 fw-bold">Hoạt động</p>
                        <button class="btn btn-outline-secondary btn-sm">Sửa</button>
                        <button class="btn btn-outline-secondary btn-sm">Xóa</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Lenovo ThinkPad X1</h5>
                        <p class="card-text mb-1"><strong>SN:</strong> LN-X1-001</p>
                        <p class="card-text mb-1 fw-bold">Laptop</p>
                        <p class="card-text mb-3 fw-bold">Hoạt động</p>
                        <button class="btn btn-outline-secondary btn-sm">Sửa</button>
                        <button class="btn btn-outline-secondary btn-sm">Xóa</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addDeviceModal" tabindex="-1" aria-labelledby="addDeviceModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h4 class="modal-title fw-bold" id="addDeviceModalLabel">Thêm Thiết bị</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body pt-2">
                    <form>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Tên</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Số Serial</label>
                                <input type="text" class="form-control">
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Loại</label>
                                <select class="form-select">
                                    <option>Laptop</option>
                                    <option>Máy bàn</option>
                                    <option>Máy in</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ngày Mua</label>
                                <input type="date" class="form-control">
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Bảo Hành</label>
                                <select class="form-select">
                                    <option>1 năm</option>
                                    <option>2 năm</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email Quản Lý</label>
                                <input type="email" class="form-control">
                            </div>
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Trạng Thái</label>
                                <select class="form-select">
                                    <option>Hoạt động</option>
                                    <option>Không hoạt động</option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-light border px-4" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-outline-dark px-4 fw-bold">Lưu</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
